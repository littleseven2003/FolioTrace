<script>
const materials=[{id:'ppt',name:'成果汇报 PPT',type:'PPT',cls:'',current:'p2',versions:[{id:'p3',n:'第三版',date:'10月21日 09:30',file:'202610210930-成果汇报.pptx',summary:['补充第四季度预算与执行数据','调整实施进度，将关键节点提前至11月','报告与演讲稿未同步修改'],parent:'第二版',author:'Codex',status:'待确认'},{id:'p2',n:'第二版',date:'10月20日 14:30',file:'202610201430-成果汇报.pptx',summary:['按评审意见重组章节结构','合并重复案例，精简背景介绍'],parent:'第一版',author:'DSH',status:'已确认'},{id:'p1',n:'第一版',date:'10月19日 16:00',file:'202610191600-成果汇报.pptx',summary:['结合项目资料形成初稿'],parent:'无 · 初稿',author:'Codex',status:'已确认'}]},{id:'report',name:'配套详细报告',type:'DOC',cls:'word',current:'r3',versions:[{id:'r3',n:'第三版',date:'10月20日 17:10',file:'202610201710-详细报告.docx',summary:['依据 PPT 第二版调整报告结构','补充各项指标的详细说明'],parent:'第二版',author:'Codex',status:'已确认'},{id:'r2',n:'第二版',date:'10月20日 10:20',file:'202610201020-详细报告.docx',summary:['补充项目案例与数据说明'],parent:'第一版（未导入）',author:'Codex',status:'已确认'}]},{id:'speech',name:'汇报演讲稿',type:'MD',cls:'md',current:'s2',versions:[{id:'s2',n:'第二版',date:'10月20日 18:00',file:'202610201800-演讲稿.md',summary:['按 PPT 第二版逐页调整讲述顺序','将预计讲述时间控制在15分钟'],parent:'第一版（未导入）',author:'DSH',status:'已确认'}]}];
const files=[{name:'编写要求.pdf',type:'PDF',role:'参考资料',note:'本次汇报的内容与格式要求'},{name:'季度预算数据.xlsx',type:'XLSX',role:'参考资料',note:'第四季度数据来源'},{name:'内容提纲.md',type:'MD',role:'过程材料',note:'用于组织章节，不作为事实依据'},{name:'去年汇报.pptx',type:'PPT',role:'不参与编写',note:'保留存档，本次不参考'}];
let view='work',selected='ppt',versionId='p3',tab='timeline',query='',handled=false,classified=false;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const currentMat=()=>materials.find(x=>x.id===selected);const currentVer=()=>currentMat().versions.find(x=>x.id===versionId)||currentMat().versions[0];
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function badge(m,v){return v.id===m.current?'<span class="badge green">当前采用</span>':v.status==='待确认'?'<span class="badge amber">待确认</span>':'<span class="badge gray">历史版本</span>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('mobileNav').value=view;$('pendingCount').textContent=Number(!handled)+Number(!classified);const titles={work:['让每次修改，有迹可循。','年度成果汇报 · 3 份产出材料 · 文件保留在原有位置'],files:['项目里的每一份材料','按用途登记文件，不改变实际存放位置'],reference:['参考资料','Agent 依据项目索引与本次要求选择参考资料'],process:['过程材料','保留提纲、整理笔记及中间产物'],excluded:['不参与编写','文件仍保留在项目中，Agent 不应默认将其纳入参考'],pending:['需要你确认的事项','只处理缺项与变化，正常记录自动接收']};$('pageTitle').textContent=titles[view][0];$('pageSub').textContent=titles[view][1];if(view==='work')renderWork();else if(view==='pending')renderPending();else renderFiles()}
function renderWork(){const m=currentMat(),v=currentVer();const cards=materials.filter(x=>x.name.toLowerCase().includes(query.toLowerCase()));$('content').innerHTML=`<div class="materials">${cards.map(x=>`<button class="material ${x.id===selected?'selected':''}" data-material="${x.id}"><span class="file-icon ${x.cls}">${x.type}</span><span><strong>${x.name}</strong><small>${x.versions.length} 个已登记版本 · ${x.versions.find(v=>v.id===x.current).n}采用中</small></span><span class="arrow"><svg class="icon icon-arrow-up-right" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></span></button>`).join('')||'<p class="empty">没有匹配的材料</p>'}</div><div class="workspace"><section class="panel"><div class="panel-head"><h2>${m.name}</h2><div class="tabs"><button class="tab ${tab==='timeline'?'active':''}" data-tab="timeline">版本时间线</button><button class="tab ${tab==='graph'?'active':''}" data-tab="graph">配套关系</button></div></div>${tab==='timeline'?`<div class="timeline"><div class="timeline-note">按生成时间排列 · 点击版本查看详情</div>${m.versions.map(x=>`<div class="version ${x.id===v.id?'chosen':''}"><span class="dot"></span><button class="version-card" data-version="${x.id}"><div class="version-top"><strong>${x.n}</strong>${badge(m,x)}<time class="mono">${x.date}</time></div><p>${x.summary[0]}</p><div class="version-meta"><span>由 ${x.author} 登记</span><span>基于 ${x.parent}</span></div></button></div>`).join('')}</div>`:graph(m,v)}<div class="panel-footer"><span>修改摘要来自 Agent 的变更记录</span><span>${m.versions.length} 个版本</span></div></section><section class="panel">${detail(m,v)}</section></div>`;
$('content').querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{selected=b.dataset.material;versionId=currentMat().versions[0].id;render()});$('content').querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{versionId=b.dataset.version;render()});$('content').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('adoptBtn').onclick=()=>{if(m.current===v.id)return;m.current=v.id;v.status='已确认';if(v.id==='p3')handled=true;render();toast(`已将${m.name} · ${v.n}设为当前采用（演示）`)};$('openFileBtn').onclick=()=>openModal('文件位置',`<p>正式版将在默认应用中打开此文件。原型没有连接实际文件夹。</p><div class="output">年度成果汇报 / 文档版本 / ${esc(v.file)}</div>`);document.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{selected=b.dataset.link;versionId=b.dataset.targetVersion||currentMat().current;tab='timeline';render()})}
function detail(m,v){return `<div class="detail"><div class="detail-kicker">VERSION DETAILS</div><h3>${v.n} ${badge(m,v)}</h3><div class="filename mono">${v.file}</div><div><div class="detail-row"><span>基础版本</span><span>${v.parent}</span></div><div class="detail-row"><span>记录来源</span><span>${v.author}</span></div></div><div><div class="section-title">本次修改</div><ul class="summary">${v.summary.map(s=>`<li>${s}</li>`).join('')}</ul></div><div><div class="section-title">本次参考</div><div class="ref"><span class="file-icon pdf">PDF</span><span>编写要求.pdf</span></div><div class="ref"><span class="file-icon xlsx">XLS</span><span>季度预算数据.xlsx</span></div></div><div><div class="section-title">${m.id==='ppt'?'配套材料':'对应的汇报版本'}</div>${m.id==='ppt'?(v.id==='p2'?'<button class="ref" data-link="report"><span class="file-icon word">DOC</span><span>详细报告 · 第三版<small>对应当前查看的 PPT 版本</small></span></button><button class="ref" data-link="speech"><span class="file-icon md">MD</span><span>演讲稿 · 第二版<small>对应当前查看的 PPT 版本</small></span></button>':`<p style="font-size:12px;color:var(--muted)">此版本暂无已登记的配套材料</p>${v.id==='p3'?'<div class="notice">已有报告和演讲稿对应 PPT 第二版。请确认本次修改是否需要同步。</div>':''}`):'<button class="ref" id="pptLink" data-link="ppt" data-target-version="p2"><span class="file-icon">PPT</span><span>成果汇报 PPT · 第二版<small>关系绑定到具体版本</small></span></button>'}</div><div class="detail-actions"><button class="btn" id="openFileBtn"><svg class="icon icon-external-link" aria-hidden="true"><use href="#i-external-link"></use></svg>打开文件</button><button class="btn primary" id="adoptBtn" ${m.current===v.id?'disabled':''}>${m.current===v.id?'已采用':'设为当前采用'}</button></div></div>`}
function graph(m,v){if(m.id==='ppt'&&v.id!=='p2')return `<div class="graph"><p class="graph-note">配套关系绑定到具体版本，与版本演变分开展示。</p><div class="graph-node">成果汇报 PPT · ${v.n}<small>${v.id===m.current?'当前采用':'当前查看'}</small></div><div class="empty">此版本暂无配套关系。<br>选择 PPT 第二版，查看已登记的报告与演讲稿。</div></div>`;return `<div class="graph"><p class="graph-note">虚线表示配套关系 · 点击材料查看其版本</p><button class="graph-node" data-link="ppt" data-target-version="p2" style="display:block;width:100%">成果汇报 PPT · 第二版<small>配套关系的依据版本</small></button><div class="graph-line"></div><div class="graph-children"><button class="graph-node" data-link="report">详细报告 · 第三版<small>展开说明与详细数据</small></button><button class="graph-node" data-link="speech">演讲稿 · 第二版<small>对应逐页讲述内容</small></button></div></div>`}
function renderFiles(){const all=[...files,...materials.flatMap(m=>m.versions.map(v=>({name:v.file,type:m.type,role:'产出材料',note:`${m.name} · ${v.n}${v.id===m.current?' · 当前采用':''}`,generated:true})))];const role={reference:'参考资料',process:'过程材料',excluded:'不参与编写'}[view];const rows=all.filter(f=>(!role||f.role===role)&&f.name.toLowerCase().includes(query.toLowerCase()));$('content').innerHTML=`<section class="panel"><div class="panel-head"><h2>${role||'文件清单'}</h2><span class="badge gray">${rows.length} 个文件</span></div><div class="table-wrap"><table><thead><tr><th>文件名称</th><th>用途</th><th>说明</th></tr></thead><tbody>${rows.map(f=>`<tr><td><span class="mono" style="font-size:10px;color:var(--blue);margin-right:10px">${f.type}</span>${esc(f.name)}</td><td>${f.generated?'<span class="badge blue">产出材料</span>':`<select class="role-select" aria-label="${esc(f.name)}的用途" data-file="${files.indexOf(f)}">${['参考资料','过程材料','不参与编写'].map(r=>`<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>`}</td><td style="color:var(--muted)">${f.note}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">没有匹配的文件</td></tr>'}</tbody></table></div></section>`;document.querySelectorAll('[data-file]').forEach(s=>s.onchange=()=>{files[Number(s.dataset.file)].role=s.value;render();toast('文件用途已更新（演示），实际文件位置保持不变')})}
function renderPending(){$('content').innerHTML=`<section class="panel"><div class="panel-head"><h2>待确认事项</h2><span class="badge amber">${Number(!handled)+Number(!classified)} 项</span></div>${!handled?'<div class="pending-item"><span class="file-icon">PPT</span><div><h3>成果汇报 PPT 有一个待确认的新版本</h3><p>第三版由 Codex 登记，已包含基础版本和修改摘要。</p></div><button class="btn subtle" id="reviewBtn">查看版本 →</button></div>':''}${!classified?'<div class="pending-item"><span class="file-icon md">MD</span><div><h3>发现未登记的文件：会议补充意见.md</h3><p>请确认它是否应作为本次编写的参考资料。</p></div><button class="btn" id="classifyBtn">指定用途</button></div>':''}${handled&&classified?'<div class="empty">✓ 所有待处理事项已完成</div>':''}</section>`;if($('reviewBtn'))$('reviewBtn').onclick=()=>{view='work';selected='ppt';versionId='p3';tab='timeline';render()};if($('classifyBtn'))$('classifyBtn').onclick=()=>{openModal('指定文件用途','<p>会议补充意见.md</p><div class="field"><label for="newRole">文件用途</label><select id="newRole"><option>参考资料</option><option>过程材料</option><option>不参与编写</option></select></div><div class="modal-foot"><button class="btn primary" id="confirmRole">确认登记</button></div>');$('confirmRole').onclick=()=>{files.push({name:'会议补充意见.md',type:'MD',role:$('newRole').value,note:'从待处理事项中登记'});classified=true;closeModal();render();toast('已登记文件用途（演示）')}}}
let previousFocus=null;function openModal(title,body){previousFocus=document.activeElement;$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="close" aria-label="关闭"><svg class="icon icon-x" aria-hidden="true"><use href="#i-x"></use></svg></button></div>${body}</section></div>`;document.querySelector('.close').onclick=closeModal;document.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};document.querySelector('.close').focus()}
function closeModal(){$('modalRoot').innerHTML='';previousFocus?.focus()}
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fs=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(e=>!e.disabled);const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('taskBtn').onclick=()=>{openModal('创建编写任务',`<p>选好材料与基础版本，将指令复制到 Codex 或 DSH 中继续。</p><div class="field"><label for="taskMaterial">编写材料</label><select id="taskMaterial">${materials.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${m.name}</option>`).join('')}</select></div><div class="field"><label for="taskVersion">基础版本</label><select id="taskVersion"></select></div><div class="field"><label>本次参考资料</label><div class="checks">${files.filter(f=>f.role==='参考资料').map(f=>`<label><input type="checkbox" name="ref" value="${esc(f.name)}" checked> ${esc(f.name)}</label>`).join('')||'<span>暂无参考资料，请先在文件清单中指定。</span>'}</div></div><div class="field"><label for="taskRequest">编写要求</label><textarea id="taskRequest" placeholder="例如：补充预算数据，保留其他章节结构。">依据最新预算数据更新相关内容，说明关键变化，保留旧版本。</textarea></div><div class="field"><label>配套材料</label><div class="checks"><label><input type="checkbox" id="syncRelated"> 同步检查并更新配套材料</label></div></div><div class="modal-foot"><button class="btn" id="cancelTask">取消</button><button class="btn primary" id="generateTask">生成编写指令 →</button></div>`);function fillVersions(){const m=materials.find(m=>m.id===$('taskMaterial').value);$('taskVersion').innerHTML=m.versions.map(v=>`<option value="${v.id}" ${v.id===m.current?'selected':''}>${v.n} · ${v.date}${v.id===m.current?' · 当前采用':''}</option>`).join('')};fillVersions();$('taskMaterial').onchange=fillVersions;$('cancelTask').onclick=closeModal;$('generateTask').onclick=()=>{const req=$('taskRequest').value.trim();if(!req){$('taskRequest').focus();return}const m=materials.find(m=>m.id===$('taskMaterial').value),v=m.versions.find(v=>v.id===$('taskVersion').value),refs=[...document.querySelectorAll('input[name="ref"]:checked')].map(x=>x.value);const text=`请在项目根目录工作，遵循 AGENTS.md，并读取 PROJECT_INDEX.md。\n\n编写材料：${m.name}\n基础版本：${v.file}\n本次参考资料：${refs.join('、')||'未指定，不默认扩大参考范围'}\n\n编写要求：\n${req}\n\n配套材料：${$('syncRelated').checked?'检查与基础版本关联的配套材料，按需要同步更新，并分别记录版本关系。':'本次暂不修改配套材料；记录新版本与已有配套材料的对应情况，不自动继承旧关系。'} const overviewLanes={ppt:{color:'#b06a39',tint:'#fff7ef',x:130,label:'汇报 PPT'},report:{color:'#4779b2',tint:'#f1f7fe',x:410,label:'详细报告'},speech:{color:'#367f70',tint:'#f0f8f5',x:690,label:'演讲稿'}};
const overviewRelations=[{from:'p2',to:'r3',label:'配套详细报告'},{from:'p2',to:'s2',label:'配套演讲稿'}];
const overviewParents={p3:'p2',p2:'p1',r3:'r2'};
let overviewSelected='p2',showOverviewRelations=true,onlyOverviewRelated=false;
function overviewNodes(){return materials.flatMap(m=>m.versions.map(v=>({m,v,lane:overviewLanes[m.id]}))).sort((a,b)=>{const stamp=n=>{const parts=n.v.date.match(/\d+/g);return parts.map(x=>x.padStart(2,'0')).join('')};return stamp(b).localeCompare(stamp(a))}).map((n,i)=>({...n,y:125+i*93}))}
function overviewNeighbours(id){const ids=new Set([id]);overviewRelations.forEach(r=>{if(r.from===id)ids.add(r.to);if(r.to===id)ids.add(r.from)});return ids}
const renderBeforeOverview=render;
render=function(){if(view!=='overview'){renderBeforeOverview();return}document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('mobileNav').value=view;$('pendingCount').textContent=Number(!handled)+Number(!classified);$('pageTitle').textContent='把所有版本，连在一起。';$('pageSub').textContent='同一材料沿实线演变，配套文件通过虚线连接到具体版本';renderOverview()};
function renderOverview(){const nodes=overviewNodes(),map=Object.fromEntries(nodes.map(n=>[n.v.id,n])),active=map[overviewSelected]||nodes[0],related=overviewNeighbours(active.v.id),q=query.trim().toLowerCase();const visible=n=>(!onlyOverviewRelated||related.has(n.v.id))&&(!q||[n.m.name,n.v.file,n.v.n,...n.v.summary].join(' ').toLowerCase().includes(q));const links=overviewRelations.filter(r=>r.from===active.v.id||r.to===active.v.id);const viewHeight=nodes.length*93+110;
let lines=Object.entries(overviewParents).map(([child,parent])=>{const c=map[child],p=map[parent];if(!c||!p)return '';return `<path class="ov-edge" d="M ${p.lane.x} ${p.y} L ${c.lane.x} ${c.y}" stroke="${c.lane.color}" opacity="${visible(c)&&visible(p)?'.85':'.13'}"/>`}).join('');
let connections=showOverviewRelations?overviewRelations.map(r=>{const a=map[r.from],b=map[r.to];return `<path class="ov-relation" d="M ${a.lane.x} ${a.y} C ${a.lane.x} ${a.y-45}, ${b.lane.x} ${b.y+65}, ${b.lane.x} ${b.y}" stroke="${b.lane.color}" style="opacity:${visible(a)&&visible(b)?'.8':'.12'}"><title>${a.m.name} ${a.v.n} → ${b.m.name} ${b.v.n}：${r.label}</title></path>`}).join(''):'';
$('content').innerHTML=`<div class="overview-intro"><div class="overview-legend">${Object.entries(overviewLanes).map(([id,l])=>`<span class="lane-key" style="--lane:${l.color}"><i></i>${l.label}<span style="font-size:10px;color:var(--muted)">${materials.find(m=>m.id===id).versions.length} 版</span></span>`).join('')}</div><div class="overview-tools"><label><input type="checkbox" id="showRelations" ${showOverviewRelations?'checked':''}>显示配套连线</label><label><input type="checkbox" id="onlyRelated" ${onlyOverviewRelated?'checked':''}>仅突出选中节点及配套</label></div></div>${q?`<div class="overview-empty-search">找到 ${nodes.filter(visible).length} 个匹配节点，其余节点淡化显示。</div>`:''}<section class="panel"><div class="panel-head overview-graph-head"><div><h2>项目版本图谱</h2><p>${nodes.length} 个版本节点 · ${overviewRelations.length} 条配套关系</p></div><div class="edge-legend"><span class="edge-key"><i></i>版本延续</span><span class="edge-key dashed"><i></i>配套关系</span><span class="overview-mobile-tip">左右滑动查看</span></div></div><div class="overview-scroll"><svg class="overview-svg" viewBox="0 0 940 ${viewHeight}" role="group" aria-label="项目版本图谱，时间从上到下由新到旧；可用 Tab 选择版本节点"><text x="17" y="44" fill="#8997a7" font-size="10">最新在上 ↓</text>${Object.values(overviewLanes).map(l=>`<rect x="${l.x-20}" y="23" width="215" height="36" rx="7" fill="${l.tint}"/><circle cx="${l.x}" cy="41" r="4" fill="${l.color}"/><text x="${l.x+15}" y="45" fill="${l.color}" font-size="12" font-weight="600">${l.label}</text><line x1="${l.x}" y1="69" x2="${l.x}" y2="${viewHeight-30}" stroke="#edf1f6" stroke-dasharray="3 6"/>`).join('')}${nodes.map(n=>`<line x1="105" y1="${n.y}" x2="908" y2="${n.y}" stroke="#f1f4f7"/><text x="17" y="${n.y-3}" fill="#8794a3" font-size="10">${n.v.date.split(' ')[0]}</text><text x="17" y="${n.y+13}" fill="#a1acb9" font-size="10" font-family="monospace">${n.v.date.split(' ')[1]}</text>`).join('')}${lines}${connections}${nodes.map(n=>`<g class="ov-node ${n.v.id===active.v.id?'is-selected':''} ${!visible(n)?'is-muted':''}" style="--node-color:${n.lane.color};--node-tint:${n.lane.tint}" role="button" tabindex="0" aria-label="${n.m.name} ${n.v.n}，${n.v.date}${n.m.current===n.v.id?'，当前采用':''}" aria-pressed="${n.v.id===active.v.id}" data-overview-node="${n.v.id}"><title>${esc(n.v.file)}</title><circle class="node-halo" cx="${n.lane.x}" cy="${n.y}" r="16" fill="${n.lane.color}"/><circle cx="${n.lane.x}" cy="${n.y}" r="7" fill="${n.v.id===active.v.id?n.lane.color:'#fff'}" stroke="${n.lane.color}" stroke-width="2.5"/><rect class="node-box" x="${n.lane.x+18}" y="${n.y-26}" width="180" height="53" rx="7"/><text class="node-name" x="${n.lane.x+30}" y="${n.y-4}">${n.v.n}</text><text class="state-text" x="${n.lane.x+89}" y="${n.y-4}">${n.m.current===n.v.id?'● 当前采用':n.v.status==='待确认'?'○ 待确认':'历史版本'}</text><text class="node-caption" x="${n.lane.x+30}" y="${n.y+13}">${n.v.author} · ${n.m.type}</text></g>`).join('')}</svg></div><div class="overview-caption"><span>实线连接同一材料的历史版本；虚线表示跨材料配套，不代表版本合并。</span><span>节点按时间顺序等距排列</span></div></section><section class="panel overview-selection" style="--selection-color:${active.lane.color}"><div><div class="detail-kicker">SELECTED VERSION</div><h3 style="color:${active.lane.color}">${active.m.name} · ${active.v.n}</h3>${badge(active.m,active.v)}<div class="filename mono">${esc(active.v.file)}</div><button class="btn subtle" id="openOverviewVersion">${tinyIcon('external-link')}查看完整版本详情</button></div><div><div class="section-title">本次修改</div><ul class="summary">${active.v.summary.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="selection-meta">基础版本：${active.v.parent}</p></div><div><div class="section-title">配套版本 · ${links.length}</div>${links.map(r=>{const n=map[r.from===active.v.id?r.to:r.from];return `<button class="relation-button" data-select-related="${n.v.id}" style="--lane:${n.lane.color}"><i></i>${n.m.name} · ${n.v.n} ${tinyIcon('arrow-up-right')}</button>`}).join('')||'<p class="selection-meta">此版本暂无已登记的配套关系。</p>'}${active.v.id==='p3'?'<div class="n  {name:'接收记录',owner:'工作台',ownerClass:'',icon:'inbox',title:'让新文件，回到正确的版本和关系中',inputTitle:'Agent 交回的产出',input:[['files','新版本文件','检查文件是否存在'],['route','变更记录','检查基础版本和关联']],action:'校验与登记',actionSub:'完整记录自动接收<br>缺项进入待处理',outputTitle:'更新后的工作台',output:[['workflow','版本图谱','接上版本线与配套节点'],['scroll-text','修改历史','生成可读的修改摘要']],note:'如果记录缺项，先补齐信息；不能仅凭文件名猜测配套关系。'},
 {name:'确认采用',owner:'你',ownerClass:'you',icon:'check',title:'最后由你决定，哪一个版本继续向前',inputTitle:'新版本待确认',input:[['scroll-text','本次修改摘要','快速了解修改范围'],['files','实际产出文件','在对应软件中检查内容']],action:'审阅并选择',actionSub:'采用这个版本<br>或继续提出修改',outputTitle:'下一轮的起点',output:[['check','当前采用版本','确认后才切换'],['layers','旧版本继续保留','可追溯，也可重新使用']],note:'如果还需要修改，回到“定义任务”，以你指定的版本开始下一轮。'}
];
let writingStageIndex=0;
function showWritingStage(index){writingStageIndex=index;const stage=writingStages[index];document.querySelectorAll('[data-writing-stage]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.writingStage)===index)));const rows=items=>items.map(([ic,title,sub])=>`<div class="artifact-row">${tinyIcon(ic)}<div>${title}<small>${sub}</small></div></div>`).join('');$('writingScene').innerHTML=`<div class="scene-header"><h3>${stage.title}</h3><span class="scene-number">0${index+1} / 05</span></div><div class="scene-body"><div class="scene-column"><div class="scene-caption">${stage.inputTitle}</div><div class="artifact-stack">${rows(stage.input)}</div></div><div class="scene-transfer"><span class="packet"></span></div><div class="scene-column"><div class="scene-action"><div class="action-icon">${tinyIcon(stage.icon)}</div><strong>${stage.action}</strong><span>${stage.actionSub}</span></div></div><div class="scene-transfer"><span class="packet"></span></div><div class="scene-column"><div class="scene-caption">${stage.outputTitle}</div><div class="artifact-stack result-stack">${rows(stage.output)}</div></div></div><div class="scene-note">${tinyIcon('route')}<span>${stage.note}</span></div>`;$('writingProgress').textContent=(index+1)+' / 5';$('previousWritingStage').disabled=index===0;$('nextWritingStage').textContent=index===4?'再看一遍 ↺':'下一步 →'}
$('flowBtn').onclick=()=>{openModal('从材料，到可采用的新版本',`<div class="flow-intro"><p>工作台管材料，Agent 做编写，最后由你确认。点击任一步，看信息如何流转。</p><span class="flow-demo-tag">流程示意</span></div><div class="flow-stages" role="group" aria-label="选择编写流程步骤">${writingStages.map((stage,i)=>`<button class="flow-step" data-writing-stage="${i}" aria-pressed="${i===0}" aria-controls="writingScene"><span class="step-index">0${i+1}</span><span class="step-disc">${tinyIcon(stage.icon)}</span><strong>${stage.name}</strong><span class="step-owner ${stage.ownerClass}">${stage.owner}</span></button>`).join('')}</div><section class="flow-scene" id="writingScene" aria-live="polite" aria-atomic="true"></section><div class="flow-shared-folder">${tinyIcon('folder-open')}<div><strong>始终围绕同一个项目文件夹</strong><small>文件留在本地，工作台和 Agent 通过规则、索引与变更记录协作。</small></div><div class="folder-chips"><span>实际文件</span><span>编写规则</span><span>版本记录</span></div></div><div class="flow-footer"><div class="flow-pagination"><button class="btn" id="previousWritingStage" aria-label="上一步">←</button><span class="flow-progress" id="writingProgress"></span><button class="btn" id="nextWritingStage">下一步 →</button></div><button class="flow-use-task" id="startFromFlow">开始创建一个编写任务 ${tinyIcon('arrow-up-right')}</button></div>`);document.body.classList.add('flow-open');document.querySelectorAll('[data-writing-stage]').forEach(b=>b.onclick=()=>showWritingStage(Number(b.dataset.writingStage)));$('previousWritingStage').onclick=()=>showWritingStage(Math.max(0,writingStageIndex-1));$('nextWritingStage').onclick=()=>showWritingStage((writingStageIndex+1)%writingStages.length);$('startFromFlow').onclick=()=>{closeModal();$('taskBtn').click()};showWritingStage(0)};
</script>
